; Flight computer firmware. One env per supported Teensy board.
; Build every env: `pio run -d firmware/flightcomp` (or `just build` at the repo root).
;
; The `teensy` platform is pinned to an exact version, and the Teensyduino core
; it bundles (framework-arduinoteensy) is pinned with it, so a build is
; reproducible. platform-teensy 6.0.0 bundles framework-arduinoteensy 1.162.0,
; which is Teensyduino 1.62. Teensyduino's own libraries (SdFat, SD, SPI, Wire,
; i2c_t3, PWMServo, EEPROM) come from that framework package, not from lib_deps.

[platformio]
default_envs = teensy41, teensy40, teensy36, teensy35, teensy31

[env]
platform = platformio/teensy@6.0.0
platform_packages = platformio/framework-arduinoteensy@1.162.0
framework = arduino
; chain+ evaluates #if/#ifdef when finding libraries, so the Teensy 3.x-only
; i2c_t3 include in flightcomp.ino is not pulled into Teensy 4.x builds (and Wire
; is not pulled into Teensy 3.x builds), matching what the Arduino builder does.
lib_ldf_mode = chain+
lib_deps =
    mikalhart/TinyGPSPlus@1.0.3

[env:teensy41]
board = teensy41

[env:teensy40]
board = teensy40

[env:teensy36]
board = teensy36

[env:teensy35]
board = teensy35

; Teensy 3.2 (PlatformIO's board id covers 3.1 and 3.2). Closest to its flash
; limit of all the supported boards, so watch its size in CI.
; PlatformIO defaults this board to 72 MHz; Teensyduino's default, which the
; firmware has been built and flown with, is 96 MHz.
[env:teensy31]
board = teensy31
board_build.f_cpu = 96000000L
