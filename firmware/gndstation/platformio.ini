; Ground station firmware. One env per supported Teensy board, plus `native` for
; the host unit tests.
; Build every env: `pio run -d firmware/gndstation` (or `just build` at the repo root).
; Run the host tests: `pio test -e native -d firmware/gndstation` (or `just test`).
;
; Platform and framework pins match firmware/flightcomp/platformio.ini; see the
; note there. The old sketches in ../archive sit outside src/ and are not built.

[platformio]
default_envs = teensy41, teensy40

[env]
platform = platformio/teensy@6.0.0
platform_packages = platformio/framework-arduinoteensy@1.162.0
framework = arduino
lib_ldf_mode = chain+
; TelemetryProtocol is the packet format and channel plan the flight computer
; sends with; symlink:// builds it from firmware/common/lib in place.
lib_deps =
    mikalhart/TinyGPSPlus@1.0.3
    sparkfun/SparkFun SerLCD Arduino Library@1.0.9
    symlink://../common/lib/TelemetryProtocol

[env:teensy41]
board = teensy41

[env:teensy40]
board = teensy40

; Host unit tests, built with the host's own g++ and run on the host, as in
; firmware/flightcomp. Not in default_envs. The tests compile the real packet
; handling and radio sources against the stand-ins in test/shim.
[env:native]
platform = platformio/native@1.2.1
platform_packages =
framework =
lib_deps =
    symlink://../common/lib/TelemetryProtocol
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wno-unused-variable
    -I test/shim
